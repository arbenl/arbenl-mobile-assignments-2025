name: Mobile checker tests
on:
  pull_request:
    paths: ['scripts/check-mobile-submission.cjs', 'tests/mobile-submission.test.cjs', '.github/workflows/mobile-*.yml']
  push:
    branches: [main]
    paths: ['scripts/check-mobile-submission.cjs', 'tests/mobile-submission.test.cjs', '.github/workflows/mobile-*.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/mobile-submission.test.cjs
