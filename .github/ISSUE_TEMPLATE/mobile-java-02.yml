name: "Mobile · Java 2 (formulari ekzistues)"
description: "Dorëzim i RideShare me kontroll automatik të skedarëve."
title: "[MOBILE J02] RideShare"
body:
  - type: markdown
    attributes:
      value: "Ngarko java-02.md dhe skica.jpg/png në repository-n tënd publik. [Udhëzimi i thjeshtë](https://arbenl.github.io/lendet/2026-2027/mobile/dorezimet.html). Pas dorëzimit raporti automatik shfaqet këtu."
  - type: input
    id: repository
    attributes:
      label: Linku i punës në GitHub
      placeholder: "https://github.com/llogaria-jote/rideshare-mobile"
    validations:
      required: true
  - type: markdown
    attributes:
      value: "Pas korrigjimit të skedarëve, komento rikontrollo në të njëjtin dorëzim. Kontrolli teknik nuk është notë. Mos publiko të dhëna personale."
